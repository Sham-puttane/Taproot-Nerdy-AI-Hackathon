<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; font-family: Fredoka, ui-rounded, system-ui, sans-serif; }
    a { color: #ffc94a; } a:hover { color: #ffd97a; }
  </style>
</helmet>

<!-- OPTION B for play — no split screen. You are UNDERGROUND, and the question
     is the thing in front of you. Progress is the soil above your head, so the
     screen never has to say "question 4 of about 8". -->
<div style="width: 390px; height: 844px; background: #4a2f14; position: relative; overflow: hidden; color: #fdf6e8;">

  <!-- strata already dug through, stacked above -->
  <div style="position: absolute; top: 0; left: 0; right: 0;">
    <div style="height: 34px; background: #ffe0a0; display: flex; align-items: center; padding: 0 18px; color: #8a7440; font-size: 12px;">
      <span style="width: 20px; height: 20px; border-radius: 7px; background: #ff7d6b; color: #16233a; display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-right: 10px;">5</span>
      Adding unlike fractions
    </div>
    <div style="height: 34px; background: #f0c477; display: flex; align-items: center; padding: 0 18px; color: #6b5220; font-size: 12px;">
      <span style="width: 20px; height: 20px; border-radius: 7px; background: #ffc94a; color: #16233a; display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-right: 10px;">4</span>
      Breaking fractions up
    </div>
    <div style="height: 34px; background: #c9974c; display: flex; align-items: center; padding: 0 18px; color: #4a3410; font-size: 12px;">
      <span style="width: 20px; height: 20px; border-radius: 7px; background: #46c9a4; color: #16233a; display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-right: 10px;">4</span>
      Why 1/2 and 2/4 match
    </div>
  </div>

  <!-- the dig face -->
  <div style="position: absolute; top: 102px; left: 0; right: 0; height: 44px; background: linear-gradient(#a87a38, #4a2f14);"></div>

  <div style="position: absolute; top: 162px; left: 20px; right: 20px;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .16em; color: #c39a5f;">GRADE 3 &middot; DIGGING</div>
    <div style="font-size: 24px; font-weight: 600; line-height: 1.14; margin-top: 6px;">Cut the cake into 4 fair pieces.</div>

    <!-- the slicer, big -->
    <div style="margin-top: 18px; background: #fdf6e8; border-radius: 24px; padding: 18px;">
      <svg viewBox="0 0 210 120" style="width: 100%; height: 120px;">
        <rect x="2" y="18" width="48" height="84" rx="10" fill="#ffc94a"/>
        <rect x="54" y="18" width="48" height="84" rx="10" fill="#ffe0a0"/>
        <rect x="106" y="18" width="48" height="84" rx="10" fill="#ffe0a0"/>
        <rect x="158" y="18" width="48" height="84" rx="10" fill="#ffe0a0"/>
        <g stroke="#16233a" stroke-width="4.5" stroke-linecap="round">
          <path d="M52 10 L52 110"/><path d="M104 10 L104 110"/><path d="M156 10 L156 110"/>
        </g>
        <g fill="#16233a">
          <circle cx="52" cy="60" r="9"/><circle cx="104" cy="60" r="9"/><circle cx="156" cy="60" r="9"/>
        </g>
      </svg>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px; color: #2f7d5d; font-size: 14px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#46c9a4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Those look equal.
      </div>
    </div>

    <div style="margin-top: 16px; background: rgba(255,255,255,.09); border-radius: 18px; padding: 13px 15px; font-size: 13.5px; line-height: 1.5; color: #e8d7b8;">
      <span style="color: #ffc94a; font-weight: 500;">Why we came down here:</span>
      breaking fractions up is built on cutting into equal parts.
    </div>
  </div>

  <!-- unexcavated ground below -->
  <svg viewBox="0 0 390 150" style="position: absolute; bottom: 96px; left: 0; width: 390px; height: 150px; opacity: .5;">
    <g fill="#3a2410">
      <circle cx="60" cy="40" r="9"/><circle cx="150" cy="72" r="6"/><circle cx="250" cy="34" r="11"/>
      <circle cx="330" cy="86" r="7"/><circle cx="100" cy="112" r="8"/>
    </g>
  </svg>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 26px;">
    <div style="background: #46c9a4; color: #16233a; border-radius: 20px; padding: 18px; text-align: center; font-size: 19px; font-weight: 600;">
      Done
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
