name: Deploy game to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Deploys QUEUE, they do not cancel each other. With cancel-in-progress a
  # rapid follow-up push kills the previous build, and if that happens a few
  # times in a row the live site silently stays several commits behind while
  # every push looks successful. Which is exactly what happened.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: app
        run: npm install

      # The pack is generated from data that is gitignored (914MB of source
      # JSONL), so a committed copy is what CI builds against. Regenerate it
      # locally with agents/pack_baker.py and commit the result.
      - name: Check the pack is present
        run: test -f app/public/pack.json || (echo "missing app/public/pack.json" && exit 1)

      - name: Build
        working-directory: app
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
